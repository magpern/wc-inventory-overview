name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: PHP Parallel Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP Lint
        run: ./vendor/bin/parallel-lint --exclude vendor --exclude .git .

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Export host uid/gid for the phpunit container
        run: |
          echo "DOCKER_UID=$(id -u)" >> "${GITHUB_ENV}"
          echo "DOCKER_GID=$(id -g)" >> "${GITHUB_ENV}"

      - name: Validate Docker Compose config
        run: docker compose -f tests/docker/docker-compose.phpunit.yml config --quiet

      - name: Start test database
        run: docker compose -f tests/docker/docker-compose.phpunit.yml up -d db

      - name: Run unit suite
        run: docker compose -f tests/docker/docker-compose.phpunit.yml run --rm phpunit --testsuite unit

      # Default filter in tests/docker/run-phpunit.sh = M1–M11 focused blocking suite.
      - name: Run M1–M11-focused suite
        run: docker compose -f tests/docker/docker-compose.phpunit.yml run --rm phpunit

      # Cumulative integration suite (includes the M0-era golden
      # characterization tests: costing/FX/movements/cost-adjustment). Was
      # continue-on-error while it carried known pre-existing test-content
      # failures -- see docs/testing.md#known-test-content-issues. M8/WP4
      # fixed all of them; this step is a normal blocking gate.
      - name: Run cumulative integration suite
        run: docker compose -f tests/docker/docker-compose.phpunit.yml run --rm phpunit --testsuite integration

      - name: Tear down test stack
        if: always()
        run: docker compose -f tests/docker/docker-compose.phpunit.yml down -v
