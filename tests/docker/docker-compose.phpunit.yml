# Ephemeral PHPUnit stack for M2-A validation.
# Usage:
#   docker compose -f tests/docker/docker-compose.phpunit.yml up -d db
#   docker compose -f tests/docker/docker-compose.phpunit.yml run --rm phpunit
#
# name: explicit, so the Compose project doesn't default to the generic
# directory name "docker" and collide with other ephemeral stacks on a
# shared host.
name: wc-io-phpunit

services:
  db:
    image: mariadb:11.8.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  phpunit:
    image: wordpress:cli-2.12.0-php8.4
    # Must match the uid:gid that owns the bind-mounted repo checkout on the
    # host, or composer/PHPUnit can't write vendor/ into it. Hardcoding
    # "1000:1000" works on this VPS (host user is uid 1000) but breaks on
    # GitHub Actions hosted runners, whose checkout is owned by a different
    # uid -- surfaced the first time CI actually ran this harness (Test
    # Infrastructure Hotfix, v1.19.1). DOCKER_UID/DOCKER_GID let each
    # environment supply its own values; unset locally, both default to
    # 1000 (unchanged behavior for this VPS).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /plugin
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress_test
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Root credentials match the db service; used only by run-phpunit.sh to
      # DROP/CREATE the test database before each suite invocation.
      WORDPRESS_DB_ROOT_PASSWORD: root
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    volumes:
      - ../../:/plugin:rw
      - phpunit-tmp:/tmp
    entrypoint: ["/bin/bash", "/plugin/tests/docker/run-phpunit.sh"]
    networks:
      - default

volumes:
  phpunit-tmp:
